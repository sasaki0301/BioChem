<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 4 – Lesson 2 Quiz: Fatty Acids and Triglycerides</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Fatty Acids and Triglycerides – Quiz</h2>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-wrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [
  {
    q: "1. Which best describes a fatty acid?",
    c: [
      "A short chain of amino acids",
      "A long hydrocarbon chain with a carboxylic acid group",
      "A sugar ring with many hydroxyl groups",
      "A nucleotide with phosphate and nitrogen base"
    ],
    a: 1,
    e: "A fatty acid has a long nonpolar hydrocarbon chain and a polar carboxylic acid group at one end."
  },
  {
    q: "2. Which part of a fatty acid is hydrophobic?",
    c: [
      "The carboxyl group",
      "The phosphate group",
      "The long hydrocarbon tail",
      "The glycerol backbone"
    ],
    a: 2,
    e: "The hydrocarbon tail is mostly nonpolar, so it is hydrophobic."
  },
  {
    q: "3. A saturated fatty acid contains:",
    c: [
      "No carbon-carbon double bonds",
      "Exactly one carbon-carbon double bond",
      "Two or more carbon-carbon double bonds",
      "A peptide bond"
    ],
    a: 0,
    e: "Saturated fatty acids have no carbon-carbon double bonds and are saturated with hydrogen."
  },
  {
    q: "4. An unsaturated fatty acid contains:",
    c: [
      "No oxygen atoms",
      "One or more carbon-carbon double bonds",
      "Only single bonds and no carboxyl group",
      "A glycosidic bond"
    ],
    a: 1,
    e: "Unsaturated fatty acids contain at least one carbon-carbon double bond."
  },
  {
    q: "5. Why do many cis unsaturated fatty acids have lower melting points?",
    c: [
      "They form peptide bonds",
      "Their bent chains prevent tight packing",
      "They contain no carbon atoms",
      "They dissolve completely in water"
    ],
    a: 1,
    e: "Cis double bonds create bends, preventing tight packing and lowering melting point."
  },
  {
    q: "6. Which fatty acid type has two or more double bonds?",
    c: [
      "Saturated",
      "Monounsaturated",
      "Polyunsaturated",
      "Trans-saturated"
    ],
    a: 2,
    e: "Polyunsaturated fatty acids contain two or more carbon-carbon double bonds."
  },
  {
    q: "7. What is the main structural difference between cis and trans fatty acids?",
    c: [
      "Cis fatty acids contain nitrogen; trans fatty acids do not",
      "Cis double bonds create bends; trans double bonds keep chains more linear",
      "Trans fats are always carbohydrates",
      "Cis fats lack carboxyl groups"
    ],
    a: 1,
    e: "Cis double bonds bend the chain, while trans double bonds allow a more linear shape."
  },
  {
    q: "8. Which factor generally increases fatty acid melting point?",
    c: [
      "Shorter chain length",
      "More cis double bonds",
      "Longer chain length and greater saturation",
      "More bends in the chain"
    ],
    a: 2,
    e: "Longer chains and greater saturation allow stronger interactions and tighter packing, increasing melting point."
  },
  {
    q: "9. What molecules are needed to form one triglyceride?",
    c: [
      "One glycerol and three fatty acids",
      "Three glycerols and one fatty acid",
      "One glucose and three amino acids",
      "One phosphate and two fatty acids only"
    ],
    a: 0,
    e: "A triglyceride is made from one glycerol molecule and three fatty acids."
  },
  {
    q: "10. What type of bond connects fatty acids to glycerol in triglycerides?",
    c: [
      "Peptide bond",
      "Glycosidic bond",
      "Ester bond",
      "Hydrogen bond only"
    ],
    a: 2,
    e: "Fatty acids connect to glycerol through ester bonds."
  },
  {
    q: "11. Triglyceride formation is an example of:",
    c: [
      "Condensation reaction",
      "Hydrolysis reaction",
      "Reduction only",
      "Ionization only"
    ],
    a: 0,
    e: "Triglycerides form by condensation, releasing water as ester bonds form."
  },
  {
    q: "12. Complete hydrolysis of one triglyceride produces:",
    c: [
      "One glycerol and three fatty acids",
      "Three glycerols and one fatty acid",
      "One amino acid and one sugar",
      "Only cholesterol"
    ],
    a: 0,
    e: "Hydrolysis breaks the three ester bonds, producing one glycerol and three fatty acids."
  },
  {
    q: "13. Which enzyme helps digest triglycerides?",
    c: [
      "Amylase",
      "Protease",
      "Lipase",
      "Lactase"
    ],
    a: 2,
    e: "Lipase hydrolyzes triglycerides by breaking ester bonds."
  },
  {
    q: "14. Why are triglycerides efficient long-term energy storage molecules?",
    c: [
      "They are highly hydrated like glycogen",
      "They contain many energy-rich C−H bonds and are stored with little water",
      "They contain peptide bonds",
      "They are mostly made of phosphate groups"
    ],
    a: 1,
    e: "Triglycerides are highly reduced and hydrophobic, so they store a lot of energy compactly."
  },
  {
    q: "15. Why is olive oil usually liquid while butter is usually solid at room temperature?",
    c: [
      "Olive oil contains more unsaturated fatty acids that pack less tightly",
      "Butter has no fatty acids",
      "Olive oil is made mostly of proteins",
      "Butter is a carbohydrate polymer"
    ],
    a: 0,
    e: "Unsaturated fatty acids in oils have bends that reduce tight packing, making many oils liquid at room temperature."
  }
];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
