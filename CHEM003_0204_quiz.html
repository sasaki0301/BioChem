<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 2 Assessment – Hydrocarbon Derivatives and Reactions</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
    position: relative;
  }

  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.1);
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 8px;
  }

  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
    text-align: left;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }

  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    font-size: 1.05em;
    transition: all 0.2s ease;
  }

  .choice:hover {
    background: #d3dbf8;
    transform: translateY(-2px);
  }

  .choice.selected {
    background: #174ea6;
    color: #fff;
    transform: scale(1.02);
  }

  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
    margin-top: 15px;
  }

  .next-btn:hover {
    background: #0f5b52;
  }

  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 20px;
  }

  .stars {
    font-size: 2.5em;
    margin-top: 10px;
    margin-bottom: 5px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .quiz-btn:hover {
    background: #d3dbf8;
    transform: translateY(-2px);
  }

  .quiz-btn.primary {
    background: #136f63;
    color: #fff;
  }

  .quiz-btn.primary:hover {
    background: #0f5b52;
  }

  @media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Chapter 2 Assessment</h2>
  <div class="progress-text" id="progressText">Question 1 of 35</div>
  <div class="progress-wrapper"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [
  { q:"1. Which functional group is present in alcohols?", c:["−OH","−COOH","−NH₂","−CHO"], a:0 },
  { q:"2. Which compound is classified as an ether?", c:["R−OH","R−O−R′","R−SH","R−CHO"], a:1 },
  { q:"3. Thiols contain which functional group?", c:["−OH","−NH₂","−SH","−COOH"], a:2 },
  { q:"4. Which functional group defines an aldehyde?", c:["Internal carbonyl","Terminal carbonyl","Carboxyl group","Amino group"], a:1 },
  { q:"5. Which functional group defines a ketone?", c:["R−CO−R′","R−CHO","R−COOH","R−NH₂"], a:0 },

  { q:"6. Oxidation of a primary alcohol using a mild oxidant commonly produces:", c:["Ketone","Aldehyde","Ether","Amide"], a:1 },
  { q:"7. Further oxidation of an aldehyde produces:", c:["Alcohol","Ketone","Carboxylic acid","Amine"], a:2 },
  { q:"8. Oxidation of a secondary alcohol produces:", c:["Aldehyde","Ketone","Carboxylic acid","Ether"], a:1 },
  { q:"9. Why are tertiary alcohols resistant to oxidation under mild conditions?", c:["They contain no oxygen","They lack an α-hydrogen","They are too acidic","They are ionic"], a:1 },
  { q:"10. Two thiols can oxidize to form:", c:["Ester bond","Disulfide bond","Peptide bond","Hydrogen bond"], a:1 },

  { q:"11. Which functional group is responsible for acidity in organic acids?", c:["Amino","Carboxyl","Ester","Amide"], a:1 },
  { q:"12. Carboxylic acids are stronger acids than alcohols mainly because:", c:["They are larger","Their conjugate base is resonance-stabilized","They contain nitrogen","They are nonpolar"], a:1 },
  { q:"13. Which group is generally basic?", c:["Carboxylic acid","Amine","Ester","Aldehyde"], a:1 },
  { q:"14. Amines act as bases because nitrogen:", c:["Has a lone pair that can accept H⁺","Always donates H⁺","Has no electrons","Forms only ionic bonds"], a:0 },
  { q:"15. Which functional group is found in many peptide bonds?", c:["Ester","Amide","Ether","Thiol"], a:1 },

  { q:"16. Esterification usually involves:", c:["Acid + Alcohol","Acid + Amine","Alcohol + Amine","Aldehyde + Ketone"], a:0 },
  { q:"17. What is released during esterification?", c:["Carbon dioxide","Water","Oxygen","Hydrogen gas"], a:1 },
  { q:"18. Esters are often known for having:", c:["Fruity odors","Strong basicity","Strong acidity","Metallic properties"], a:0 },
  { q:"19. Hydrolysis of an ester produces:", c:["Alcohol + Carboxylic acid","Amine + Alcohol","Amide + Water","Ether + Acid"], a:0 },
  { q:"20. Hydrolysis uses which molecule to break bonds?", c:["Oxygen","Water","Nitrogen","Carbon dioxide"], a:1 },

  { q:"21. Amide formation can occur from:", c:["Carboxylic acid + Amine","Alcohol + Ether","Ketone + Thiol","Aldehyde + Alcohol"], a:0 },
  { q:"22. Peptide bond formation is an example of:", c:["Hydrolysis","Condensation","Oxidation","Reduction"], a:1 },
  { q:"23. During condensation, water is:", c:["Added","Removed","Converted into oxygen","Stored as ATP"], a:1 },
  { q:"24. During hydrolysis, water is:", c:["Used to break a bond","Removed to form a bond","Converted into acid","Released as gas"], a:0 },
  { q:"25. Amides are less reactive than esters mainly because of:", c:["Resonance stabilization","Higher acidity","Lack of carbonyl","Low molecular mass"], a:0 },

  { q:"26. Which sequence shows increasing oxidation?", c:["Acid → Aldehyde → Alcohol","Alcohol → Aldehyde → Carboxylic acid","Aldehyde → Alcohol → Acid","Alcohol → Acid → Aldehyde"], a:1 },
  { q:"27. Reduction of an aldehyde commonly produces:", c:["Alcohol","Carboxylic acid","Amide","Ester"], a:0 },
  { q:"28. Which reaction builds larger molecules by joining smaller molecules?", c:["Hydrolysis","Condensation","Reduction","Combustion"], a:1 },
  { q:"29. Which reaction breaks larger molecules into smaller units?", c:["Condensation","Hydrolysis","Oxidation","Esterification"], a:1 },
  { q:"30. Which reaction is important in digestion of fats and proteins?", c:["Hydrolysis","Esterification only","Combustion","Polymerization only"], a:0 },

  { q:"31. Which functional group is found in fatty acids?", c:["Carboxylic acid","Amide","Ether","Aldehyde only"], a:0 },
  { q:"32. Which group is especially important in protein structure because it forms disulfide bonds?", c:["Thiol","Ester","Ether","Aldehyde"], a:0 },
  { q:"33. Which functional group is common in fats and oils?", c:["Ester","Amine","Aldehyde","Ketone only"], a:0 },
  { q:"34. Which pair correctly matches the group with its property?", c:["Amine-acidic","Carboxylic acid-basic","Amide-stable due to resonance","Ester-strong base"], a:2 },
  { q:"35. Which best describes interconversion?", c:["Changing one functional group into another","Destroying all organic molecules","Removing all carbon atoms","Making only inorganic compounds"], a:0 }
];

let current = 0;
let score = 0;

const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];

  quizBox.innerHTML = `
    <div class="question">${q.q}</div>
    <div class="choices">
      ${q.c.map((choice, i) => `<button class="choice" onclick="selectChoice(${i})">${choice}</button>`).join("")}
    </div>
  `;

  nextBtn.style.display = "none";
  updateProgress();
}

function selectChoice(i) {
  const q = quizData[current];

  document.querySelectorAll(".choice").forEach((btn, index) => {
    btn.disabled = true;
    if (index === i) {
      btn.classList.add("selected");
    }
  });

  if (i === q.a) score++;

  nextBtn.style.display = "inline-block";
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) {
    showQuestion();
  } else {
    showResult();
  }
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Assessment Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class="stars">${getStarRating(percent)}</div>
    <div class="result">You scored ${score}/${quizData.length} (${percent}%)</div>
    <div class="quiz-nav">
      <button class="quiz-btn" id="backBtn">⬅ Back</button>
      <button class="quiz-btn" id="retryBtn">🔁 Retry</button>
      <button class="quiz-btn primary" id="nextChapterBtn" ${passed ? "" : "disabled"}>➡ Next Chapter</button>
    </div>
  `;

  nextBtn.style.display = "none";

  window.parent.postMessage({
    type: "quizResult",
    score: percent,
    passed: passed
  }, "*");

  document.getElementById("retryBtn").addEventListener("click", retryAssessment);
  document.getElementById("backBtn").addEventListener("click", () => {
    window.parent.postMessage({ type: "quizBack" }, "*");
  });

  document.getElementById("nextChapterBtn").addEventListener("click", () => {
    if (passed) {
      window.parent.postMessage({ type: "quizNextLesson" }, "*");
    }
  });
}

function retryAssessment() {
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>

</body>
</html>
