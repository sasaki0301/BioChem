<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 3 – Lesson 1 Quiz: Nature and Classification of Carbohydrates</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #fff;
    border-radius: 18px;
    padding: 40px 50px;
    width: 95%;
    max-width: 850px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.08);
    text-align: center;
  }

  h2 {
    color: #136f63;
    margin-bottom: 20px;
  }

  .progress-text {
    text-align: right;
    font-weight: 600;
    color: #174ea6;
  }

  .progress-wrapper {
    height: 14px;
    background: #e9f5ef;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    border-radius: 8px;
  }

  .question {
    font-size: 1.2em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
    text-align: left;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .choice {
    background: #e8ecf8;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    border: none;
    transition: 0.2s;
  }

  .choice:hover {
    background: #d3dbf8;
  }

  .choice.selected {
    background: #174ea6;
    color: #fff;
  }

  .choice.correct {
    background: #2e7d32;
    color: #fff;
  }

  .choice.wrong {
    background: #c62828;
    color: #fff;
  }

  .explanation {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #eef3ff;
    border-radius: 10px;
    text-align: left;
  }

  .next-btn {
    margin-top: 20px;
    padding: 12px 26px;
    border-radius: 10px;
    border: none;
    background: #136f63;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  .next-btn:hover {
    background: #0f5b52;
  }

  .stars {
    font-size: 2.5em;
  }

  .result {
    font-size: 1.3em;
    font-weight: bold;
  }

  .quiz-nav {
    margin-top: 20px;
  }

  .quiz-btn {
    padding: 10px 20px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  .primary {
    background: #136f63;
    color: white;
  }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Carbohydrates – Lesson 1 Quiz</h2>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-wrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [
  {
    q: "1. Which best describes a carbohydrate?",
    c: ["Hydrocarbon only", "Polyhydroxy aldehyde or ketone", "Nitrogen-based molecule", "Nonpolar compound"],
    a: 1,
    e: "Carbohydrates are commonly defined as polyhydroxy aldehydes or ketones."
  },
  {
    q: "2. Which formula best represents many simple carbohydrates?",
    c: ["CₙH₂ₙ", "Cₙ(H₂O)ₙ", "CₙHₙO₂", "CH₄"],
    a: 1,
    e: "Many carbohydrates follow the empirical formula Cₙ(H₂O)ₙ."
  },
  {
    q: "3. Which of the following is a monosaccharide?",
    c: ["Sucrose", "Glucose", "Starch", "Cellulose"],
    a: 1,
    e: "Glucose is a single sugar unit, making it a monosaccharide."
  },
  {
    q: "4. Which is a disaccharide?",
    c: ["Glucose", "Fructose", "Sucrose", "Glycogen"],
    a: 2,
    e: "Sucrose consists of glucose and fructose."
  },
  {
    q: "5. Which is a polysaccharide?",
    c: ["Glucose", "Maltose", "Ribose", "Glycogen"],
    a: 3,
    e: "Glycogen is a storage polysaccharide in animals."
  },
  {
    q: "6. What type of monosaccharide is glucose?",
    c: ["Ketopentose", "Aldohexose", "Aldopentose", "Ketohexose"],
    a: 1,
    e: "Glucose is an aldose with six carbons, making it an aldohexose."
  },
  {
    q: "7. Which is a ketose?",
    c: ["Glucose", "Galactose", "Fructose", "Ribose"],
    a: 2,
    e: "Fructose contains a ketone group."
  },
  {
    q: "8. Ribose is classified as:",
    c: ["Aldohexose", "Ketopentose", "Aldopentose", "Ketohexose"],
    a: 2,
    e: "Ribose has an aldehyde group and five carbons."
  },
  {
    q: "9. Which carbohydrate is primarily used for energy storage in plants?",
    c: ["Glycogen", "Cellulose", "Starch", "Chitin"],
    a: 2,
    e: "Starch is the storage carbohydrate in plants."
  },
  {
    q: "10. Which carbohydrate is structural in plants?",
    c: ["Glycogen", "Cellulose", "Glucose", "Sucrose"],
    a: 1,
    e: "Cellulose forms plant cell walls."
  },
  {
    q: "11. What type of reaction forms disaccharides?",
    c: ["Hydrolysis", "Oxidation", "Condensation", "Reduction"],
    a: 2,
    e: "Condensation reactions join sugars and release water."
  },
  {
    q: "12. Which sugar is non-reducing?",
    c: ["Glucose", "Maltose", "Sucrose", "Lactose"],
    a: 2,
    e: "Sucrose is non-reducing because both anomeric carbons are involved."
  }
];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>

</body>
</html>
