<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 1 Comprehensive Assessment – Foundations of Biochemistry</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
    position: relative;
  }

  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.1);
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 8px;
  }

  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }

  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    font-size: 1.05em;
    transition: all 0.2s ease;
  }

  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
    margin-top: 15px;
  }

  .next-btn:hover { background: #0f5b52; }

  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 20px;
  }

  .stars {
    font-size: 2.5em;
    margin-top: 10px;
    margin-bottom: 5px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }
</style>
</head>

<body>
<div class="quiz-container">
  <h2>Chapter 1 Comprehensive Assessment</h2>
  <div class="progress-text" id="progressText">Question 1 of 25</div>
  <div class="progress-wrapper"><div class="progress-bar" id="progressBar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [
  { q:"1. Biochemistry is best described as:", c:["The study of living cells only","The study of chemical processes in living organisms","The study of nonliving compounds","The analysis of metals in biology"], a:1 },
  { q:"2. Which biomolecule serves as the main source of energy?", c:["Proteins","Lipids","Carbohydrates","Nucleic acids"], a:2 },
  { q:"3. Which element is found in all organic compounds?", c:["Nitrogen","Carbon","Phosphorus","Sulfur"], a:1 },
  { q:"4. What type of bond involves the sharing of electrons?", c:["Hydrogen","Covalent","Ionic","Peptide"], a:1 },
  { q:"5. The weak attractions between water molecules are called:", c:["Covalent bonds","Hydrogen bonds","Ionic bonds","Metallic bonds"], a:1 },
  { q:"6. Which six elements make up most living matter?", c:["C, H, O, N, P, S","Na, K, Fe, Cl, Ca, Zn","H, O, C, Mg, Fe, Ca","C, O, N, F, P, Ar"], a:0 },
  { q:"7. What property of water allows it to dissolve many substances?", c:["It is polar","It is nonpolar","It has metallic bonds","It is basic"], a:0 },
  { q:"8. The backbone of all organic molecules is:", c:["Oxygen","Carbon","Nitrogen","Sulfur"], a:1 },
  { q:"9. A functional group is:", c:["A group of atoms giving specific chemical properties","A random group of atoms","An ionic bond","A type of protein"], a:0 },
  { q:"10. The hydroxyl group is represented as:", c:["–COOH","–OH","–NH₂","–SH"], a:1 },
  { q:"11. Carboxyl groups make molecules:", c:["Basic","Nonpolar","Acidic","Neutral"], a:2 },
  { q:"12. Amino groups make molecules:", c:["Basic","Acidic","Nonpolar","Inert"], a:0 },
  { q:"13. A disulfide bridge forms between:", c:["Two oxygen atoms","Two sulfur atoms","Nitrogen and oxygen","Carbon and phosphorus"], a:1 },
  { q:"14. Which of these contains a phosphate group?", c:["ATP","Glucose","Methane","Urea"], a:0 },
  { q:"15. A peptide bond is a type of:", c:["Amide linkage","Ester bond","Ionic bond","Hydrogen bond"], a:0 },
  { q:"16. What functional group is in alcohols?", c:["Hydroxyl","Carbonyl","Carboxyl","Phosphate"], a:0 },
  { q:"17. The molecule CH₃CH₂COOH is classified as:", c:["Alcohol","Carboxylic acid","Amine","Ester"], a:1 },
  { q:"18. The basic structural units of proteins are:", c:["Sugars","Fatty acids","Amino acids","Phospholipids"], a:2 },
  { q:"19. The building blocks of nucleic acids are:", c:["Monosaccharides","Nucleotides","Fatty acids","Amino acids"], a:1 },
  { q:"20. Which bond is the strongest?", c:["Hydrogen bond","Covalent bond","Ionic bond","Peptide bond"], a:1 },
  { q:"21. ATP stores energy in its:", c:["Phosphate bonds","Hydrogen bonds","Carboxyl groups","Amide linkages"], a:0 },
  { q:"22. Functional groups influence:", c:["Only color","Physical and chemical properties","Mass only","Molecular size only"], a:1 },
  { q:"23. The study of the structure and function of biomolecules is part of:", c:["Genetics","Biochemistry","Physics","Botany"], a:1 },
  { q:"24. Which of these is not a functional group?", c:["Hydroxyl","Methyl","Carboxyl","Calcium"], a:3 },
  { q:"25. The main solvent in biological systems is:", c:["Ethanol","Water","Oil","Acetone"], a:1 }
];

let current = 0, score = 0, selected = null;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
}

function selectChoice(i) {
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    btn.disabled = true;
  });
  if (i === quizData[current].a) score++;
  nextBtn.style.display = "inline-block";
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Assessment Completed";
  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn'>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn'>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' ${passed ? "" : "disabled"}>➡ Next Chapter</button>
    </div>
  `;

  nextBtn.style.display = "none";
  window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");

  document.getElementById("retryBtn").addEventListener("click", retryQuiz);
  document.getElementById("backBtn").addEventListener("click", () => window.parent.postMessage({ type: "quizBack" }, "*"));
  document.getElementById("nextLessonBtn").addEventListener("click", () => { if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*"); });
}

function retryQuiz() {
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
