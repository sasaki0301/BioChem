<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson 2 Quiz: Carboxylic Acids, Esters, Amines, and Amides</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg,#e8f9f1,#f7faff);
  margin:0;
  padding:40px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.quiz-container {
  background:#fff;
  padding:40px;
  border-radius:18px;
  width:95%;
  max-width:850px;
  box-shadow:0 8px 28px rgba(0,0,0,0.08);
}

h2 { color:#136f63; text-align:center; }

.progress-bar {
  height:12px;
  background:#136f63;
  width:0%;
  border-radius:6px;
  margin-bottom:20px;
}

.question {
  font-size:1.3em;
  margin-bottom:15px;
  color:#174ea6;
}

.choice {
  display:block;
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  background:#e8ecf8;
  cursor:pointer;
}

.choice:hover { background:#d3dbf8; }
.choice.selected { background:#174ea6; color:#fff; }

.explanation {
  display:none;
  background:#eef3ff;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.next-btn {
  margin-top:15px;
  padding:10px 20px;
  background:#136f63;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.choice.correct {
  background:#2e7d32;
  color:#fff;
}

.choice.wrong {
  background:#c62828;
  color:#fff;
}

.result { text-align:center; font-size:1.3em; margin-top:20px; }
.stars { font-size:2em; }
</style>
</head>

<body>

<div class="quiz-container">
<h2>Lesson 2 Quiz</h2>
<div id="progressBar" class="progress-bar"></div>
<div id="quizBox"></div>
<button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [

{
q:"1. Which functional group is responsible for the acidity of organic acids?",
c:["Amine","Carboxyl","Ester","Amide"],
a:1,
e:"The carboxyl group (−COOH) donates H⁺ and is stabilized by resonance."
},

{
q:"2. Why are carboxylic acids stronger acids than alcohols?",
c:["More hydrogen atoms","Resonance stabilization of conjugate base","Larger molecules","Higher boiling point"],
a:1,
e:"The conjugate base (carboxylate) is stabilized by resonance, making it more stable."
},

{
q:"3. What type of reaction forms an ester?",
c:["Addition","Substitution","Condensation","Elimination"],
a:2,
e:"Esterification is a condensation reaction where water is removed."
},

{
q:"4. Which compound is most likely to have a fruity smell?",
c:["CH₃COOH","CH₃COOCH₃","CH₃NH₂","CH₃CONH₂"],
a:1,
e:"Esters are known for their characteristic fruity odors."
},

{
q:"5. Why are amines basic?",
c:["They donate electrons","They have double bonds","They contain oxygen","They lack hydrogen"],
a:0,
e:"Amines have a lone pair on nitrogen that can accept H⁺."
},

{
q:"6. Which of the following is an amide?",
c:["CH₃COOH","CH₃COOCH₃","CH₃CONH₂","CH₃NH₂"],
a:2,
e:"Amides contain the −CONH₂ functional group."
},

{
q:"7. What bond connects amino acids in proteins?",
c:["Ester bond","Peptide bond","Ionic bond","Hydrogen bond"],
a:1,
e:"Peptide bonds are amide linkages between amino acids."
},

{
q:"8. Why are amides less reactive than esters?",
c:["They are larger","They have resonance stabilization","They lack carbon","They are nonpolar"],
a:1,
e:"Resonance between nitrogen and carbonyl stabilizes amides."
},

{
q:"9. Which compound can act as a base?",
c:["Carboxylic acid","Ester","Amine","Amide"],
a:2,
e:"Amines can accept protons due to lone pair electrons."
},

{
q:"10. What is produced when an ester is hydrolyzed?",
c:["Alcohol + Acid","Amine + Acid","Alcohol + Amine","Acid + Amide"],
a:0,
e:"Hydrolysis breaks ester into alcohol and carboxylic acid."
},

{
q:"11. Which functional group is present in fatty acids?",
c:["Amine","Amide","Carboxylic acid","Ester"],
a:2,
e:"Fatty acids contain carboxyl groups."
},

{
q:"12. Which has the strongest intermolecular forces?",
c:["Ester","Amine","Carboxylic acid","Amide"],
a:2,
e:"Carboxylic acids form strong hydrogen-bonded dimers."
},

{
q:"13. Why do esters have lower boiling points than acids?",
c:["Smaller size","No hydrogen bonding","More stable","Higher polarity"],
a:1,
e:"Esters cannot donate hydrogen bonds unlike acids."
},

{
q:"14. Which is most stable due to resonance?",
c:["Amine","Ester","Amide","Alcohol"],
a:2,
e:"Amides have strong resonance stabilization involving nitrogen."
},

{
q:"15. What happens during peptide bond formation?",
c:["Water is added","Water is removed","Oxygen is removed","Nitrogen is removed"],
a:1,
e:"Peptide bond formation is a condensation reaction removing water."
}

];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>

</body>
</html>
