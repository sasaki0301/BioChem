<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson 2 Quiz: Carboxylic Acids, Esters, Amines, and Amides</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg,#e8f9f1,#f7faff);
  margin:0;
  padding:40px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.quiz-container {
  background:#fff;
  padding:40px;
  border-radius:18px;
  width:95%;
  max-width:850px;
  box-shadow:0 8px 28px rgba(0,0,0,0.08);
}

h2 { color:#136f63; text-align:center; }

.progress-bar {
  height:12px;
  background:#136f63;
  width:0%;
  border-radius:6px;
  margin-bottom:20px;
}

.question {
  font-size:1.3em;
  margin-bottom:15px;
  color:#174ea6;
}

.choice {
  display:block;
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  background:#e8ecf8;
  cursor:pointer;
}

.choice:hover { background:#d3dbf8; }
.choice.selected { background:#174ea6; color:#fff; }

.explanation {
  display:none;
  background:#eef3ff;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.next-btn {
  margin-top:15px;
  padding:10px 20px;
  background:#136f63;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.choice.correct {
  background:#2e7d32;
  color:#fff;
}

.choice.wrong {
  background:#c62828;
  color:#fff;
}

.result { text-align:center; font-size:1.3em; margin-top:20px; }
.stars { font-size:2em; }
</style>
</head>

<body>

<div class="quiz-container">
<h2>Lesson 2 Quiz</h2>
<div id="progressBar" class="progress-bar"></div>
<div id="quizBox"></div>
<button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [

{
q:"1. Which functional group is responsible for the acidity of organic acids?",
c:["Amine","Carboxyl","Ester","Amide"],
a:1,
e:"The carboxyl group (−COOH) donates H⁺ and is stabilized by resonance."
},

{
q:"2. Why are carboxylic acids stronger acids than alcohols?",
c:["More hydrogen atoms","Resonance stabilization of conjugate base","Larger molecules","Higher boiling point"],
a:1,
e:"The conjugate base (carboxylate) is stabilized by resonance, making it more stable."
},

{
q:"3. What type of reaction forms an ester?",
c:["Addition","Substitution","Condensation","Elimination"],
a:2,
e:"Esterification is a condensation reaction where water is removed."
},

{
q:"4. Which compound is most likely to have a fruity smell?",
c:["CH₃COOH","CH₃COOCH₃","CH₃NH₂","CH₃CONH₂"],
a:1,
e:"Esters are known for their characteristic fruity odors."
},

{
q:"5. Why are amines basic?",
c:["They donate electrons","They have double bonds","They contain oxygen","They lack hydrogen"],
a:0,
e:"Amines have a lone pair on nitrogen that can accept H⁺."
},

{
q:"6. Which of the following is an amide?",
c:["CH₃COOH","CH₃COOCH₃","CH₃CONH₂","CH₃NH₂"],
a:2,
e:"Amides contain the −CONH₂ functional group."
},

{
q:"7. What bond connects amino acids in proteins?",
c:["Ester bond","Peptide bond","Ionic bond","Hydrogen bond"],
a:1,
e:"Peptide bonds are amide linkages between amino acids."
},

{
q:"8. Why are amides less reactive than esters?",
c:["They are larger","They have resonance stabilization","They lack carbon","They are nonpolar"],
a:1,
e:"Resonance between nitrogen and carbonyl stabilizes amides."
},

{
q:"9. Which compound can act as a base?",
c:["Carboxylic acid","Ester","Amine","Amide"],
a:2,
e:"Amines can accept protons due to lone pair electrons."
},

{
q:"10. What is produced when an ester is hydrolyzed?",
c:["Alcohol + Acid","Amine + Acid","Alcohol + Amine","Acid + Amide"],
a:0,
e:"Hydrolysis breaks ester into alcohol and carboxylic acid."
},

{
q:"11. Which functional group is present in fatty acids?",
c:["Amine","Amide","Carboxylic acid","Ester"],
a:2,
e:"Fatty acids contain carboxyl groups."
},

{
q:"12. Which has the strongest intermolecular forces?",
c:["Ester","Amine","Carboxylic acid","Amide"],
a:2,
e:"Carboxylic acids form strong hydrogen-bonded dimers."
},

{
q:"13. Why do esters have lower boiling points than acids?",
c:["Smaller size","No hydrogen bonding","More stable","Higher polarity"],
a:1,
e:"Esters cannot donate hydrogen bonds unlike acids."
},

{
q:"14. Which is most stable due to resonance?",
c:["Amine","Ester","Amide","Alcohol"],
a:2,
e:"Amides have strong resonance stabilization involving nitrogen."
},

{
q:"15. What happens during peptide bond formation?",
c:["Water is added","Water is removed","Oxygen is removed","Nitrogen is removed"],
a:1,
e:"Peptide bond formation is a condensation reaction removing water."
}

];

let current=0,score=0;

function loadQuestion(){
const q=quizData[current];
document.getElementById("quizBox").innerHTML=`
<div class="question">${q.q}</div>
${q.c.map((choice,i)=>`<button class="choice" onclick="select(${i})">${choice}</button>`).join("")}
<div class="explanation" id="exp"></div>
`;
document.getElementById("nextBtn").style.display="none";
updateBar();
}

function select(i){
const q=quizData[current];
const exp=document.getElementById("exp");
const correct=i===q.a;

if(index === q.a) btn.classList.add("correct");
if(index === i && !correct) btn.classList.add("wrong");
  
if(correct) score++;

exp.innerHTML=(correct?"✅ Correct! ":"❌ Incorrect. ")+q.e;
exp.style.display="block";

document.querySelectorAll(".choice").forEach(btn=>btn.disabled=true);

document.getElementById("nextBtn").style.display="block";
}

document.getElementById("nextBtn").onclick=()=>{
current++;
if(current<quizData.length){
loadQuestion();
}else{
showResult();
}
};

function updateBar(){
document.getElementById("progressBar").style.width=(current/quizData.length*100)+"%";
}

function showResult(){
const percent=Math.round(score/quizData.length*100);
let stars=percent>=90?"⭐⭐⭐":percent>=80?"⭐⭐☆":"⭐☆☆";

document.getElementById("quizBox").innerHTML=`
<div class="stars">${stars}</div>
<div class="result">Score: ${score}/${quizData.length} (${percent}%)</div>
`;
document.getElementById("nextBtn").style.display="none";

window.parent.postMessage({type:"quizResult",score:percent,passed:percent>=80},"*");
}

loadQuestion();
</script>

</body>
</html>
