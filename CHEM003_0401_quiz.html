<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 4 – Lesson 1 Quiz: Introduction to Lipids and Classification</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* === QUIZ CONTAINER === */
.quiz-container {
  background: #fff;
  border-radius: 18px;
  padding: 40px 50px;
  width: 95%;
  max-width: 850px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.08);
  text-align: center;
}

h2 {
  color: #136f63;
  margin-bottom: 20px;
  font-size: 1.8em;
}

/* === PROGRESS === */
.progress-text {
  text-align: right;
  font-weight: 600;
  color: #174ea6;
  margin-bottom: 10px;
}

.progress-wrapper {
  height: 14px;
  background: #e9f5ef;
  border-radius: 8px;
  margin-bottom: 25px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(to right, #136f63, #2b7de9);
  transition: width 0.4s ease;
}

/* === QUESTION === */
.question {
  font-size: 1.25em;
  font-weight: 600;
  color: #174ea6;
  margin-bottom: 20px;
  text-align: left;
}

/* === MOBILE-FRIENDLY CHOICE FORMAT === */
.choices {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 25px;
}

.choice {
  background: #e8ecf8;
  border: none;
  border-radius: 10px;
  padding: 14px 18px;
  cursor: pointer;
  text-align: left;
  font-size: 1.05em;
  transition: all 0.2s ease;
}

.choice:hover {
  background: #d3dbf8;
  transform: translateY(-2px);
}

.choice.selected {
  background: #174ea6;
  color: #fff;
  transform: scale(1.02);
}

.choice.correct {
  background: #2e7d32;
  color: #fff;
}

.choice.wrong {
  background: #c62828;
  color: #fff;
}

/* === EXPLANATION === */
.explanation {
  display: none;
  margin-top: 15px;
  padding: 14px 18px;
  background: #eef3ff;
  border-radius: 10px;
  text-align: left;
  font-size: 1.05em;
}

/* === BUTTONS === */
.next-btn {
  margin-top: 20px;
  padding: 12px 26px;
  border-radius: 10px;
  border: none;
  background: #136f63;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 1.05em;
}

.next-btn:hover {
  background: #0f5b52;
}

/* === RESULT === */
.stars {
  font-size: 2.5em;
  margin-bottom: 10px;
}

.result {
  font-size: 1.3em;
  font-weight: bold;
  color: #174ea6;
  margin-top: 10px;
}

.quiz-nav {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.quiz-btn {
  background: #e8ecf8;
  color: #174ea6;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 0.95em;
  cursor: pointer;
  transition: 0.2s;
}

.quiz-btn:hover {
  background: #d3dbf8;
  transform: translateY(-2px);
}

.quiz-btn.primary {
  background: #136f63;
  color: white;
}

.quiz-btn.primary:hover {
  background: #0f5b52;
}

@media (max-width: 600px) {
  body { padding: 25px 12px; }
  .quiz-container { padding: 25px; }
  .question { font-size: 1.1em; }
  .stars { font-size: 2em; }
}
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Introduction to Lipids and Classification – Quiz</h2>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-wrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [
  {
    q: "1. Which statement best describes lipids as a group of biomolecules?",
    c: [
      "They all have the same exact structure",
      "They are grouped mainly by poor solubility in water",
      "They are always made of amino acids",
      "They dissolve easily in water because they are highly polar"
    ],
    a: 1,
    e: "Lipids are structurally diverse, but they are grouped mainly because they are hydrophobic or poorly soluble in water."
  },
  {
    q: "2. Why do most lipids not dissolve well in water?",
    c: [
      "They contain many charged phosphate groups",
      "They are mostly nonpolar and cannot interact strongly with polar water",
      "They are made only of nitrogen",
      "They always contain ionic bonds"
    ],
    a: 1,
    e: "Most lipids contain large nonpolar hydrocarbon regions, which do not form strong interactions with water."
  },
  {
    q: "3. What does hydrophobic mean?",
    c: [
      "Water-loving",
      "Water-fearing or poorly interacting with water",
      "Able to form peptide bonds",
      "Highly soluble in water"
    ],
    a: 1,
    e: "Hydrophobic means water-fearing or having poor interaction with water."
  },
  {
    q: "4. What does amphipathic mean?",
    c: [
      "Having only hydrophobic regions",
      "Having both hydrophilic and hydrophobic regions",
      "Having no carbon atoms",
      "Being completely soluble in water"
    ],
    a: 1,
    e: "Amphipathic molecules have both hydrophilic and hydrophobic parts, such as phospholipids."
  },
  {
    q: "5. Which lipid is most directly involved in forming cell membranes?",
    c: [
      "Phospholipid",
      "Wax",
      "Glucose",
      "Amino acid"
    ],
    a: 0,
    e: "Phospholipids are amphipathic and form the main structure of cell membranes."
  },
  {
    q: "6. Which part of a phospholipid is hydrophilic?",
    c: [
      "Fatty acid tails",
      "Phosphate-containing head",
      "Entire hydrocarbon chain",
      "Only the nonpolar region"
    ],
    a: 1,
    e: "The phosphate-containing head is hydrophilic, while the fatty acid tails are hydrophobic."
  },
  {
    q: "7. Which part of a phospholipid is hydrophobic?",
    c: [
      "Phosphate head",
      "Fatty acid tails",
      "Water-facing region",
      "Charged head group"
    ],
    a: 1,
    e: "The fatty acid tails are hydrophobic because they are mostly nonpolar hydrocarbon chains."
  },
  {
    q: "8. Which function is most strongly associated with triglycerides?",
    c: [
      "Immediate genetic information storage",
      "Long-term energy storage",
      "Protein synthesis",
      "Formation of DNA bases"
    ],
    a: 1,
    e: "Triglycerides are major long-term energy storage molecules."
  },
  {
    q: "9. Why are lipids efficient long-term energy storage molecules?",
    c: [
      "They contain many reduced C−H bonds and store compactly without much water",
      "They are always water-soluble",
      "They contain more nitrogen than proteins",
      "They are always charged"
    ],
    a: 0,
    e: "Lipids have many energy-rich C−H bonds and are hydrophobic, so they store compactly with little associated water."
  },
  {
    q: "10. Which group contains fats, oils, and waxes?",
    c: [
      "Simple lipids",
      "Compound lipids",
      "Derived lipids",
      "Nucleic acids"
    ],
    a: 0,
    e: "Fats, oils, and waxes are classified as simple lipids."
  },
  {
    q: "11. Which group includes phospholipids, glycolipids, and lipoproteins?",
    c: [
      "Simple lipids",
      "Compound lipids",
      "Derived lipids",
      "Monosaccharides"
    ],
    a: 1,
    e: "Compound lipids contain additional groups such as phosphate, carbohydrate, or protein components."
  },
  {
    q: "12. Which group includes cholesterol, steroids, fatty acids, and fat-soluble vitamins?",
    c: [
      "Derived lipids",
      "Simple sugars",
      "Amino acids",
      "Disaccharides"
    ],
    a: 0,
    e: "Derived lipids include fatty acids, steroids, cholesterol, and fat-soluble vitamins."
  },
  {
    q: "13. Which lipid helps transport lipids through the blood?",
    c: [
      "Lipoprotein",
      "Cellulose",
      "Glycogen",
      "Ribose"
    ],
    a: 0,
    e: "Lipoproteins are complexes of lipids and proteins that help transport hydrophobic lipids in watery blood."
  },
  {
    q: "14. Which statement best compares carbohydrates and lipids?",
    c: [
      "Carbohydrates are generally better for quick energy, while lipids are better for long-term energy storage",
      "Lipids dissolve better in water than carbohydrates",
      "Carbohydrates are always hydrophobic",
      "Lipids are always made of sugar rings"
    ],
    a: 0,
    e: "Carbohydrates are commonly used for quick energy, while lipids are more efficient for long-term storage."
  },
  {
    q: "15. Which vitamins are fat-soluble?",
    c: [
      "B and C",
      "A, D, E, and K",
      "Only vitamin C",
      "All vitamins are fat-soluble"
    ],
    a: 1,
    e: "Vitamins A, D, E, and K are fat-soluble and are transported with lipids."
  }
];

let current = 0;
let score = 0;
let showingExplanation = false;

const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];

  quizBox.innerHTML = `
    <div class="question">${q.q}</div>
    <div class="choices">
      ${q.c.map((choice,i)=>`<button class="choice" onclick="selectChoice(${i})">${choice}</button>`).join("")}
    </div>
    <div class="explanation" id="exp"></div>
  `;

  nextBtn.style.display = "none";
  showingExplanation = false;

  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
  progressBar.style.width = `${(current / quizData.length) * 100}%`;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const exp = document.getElementById("exp");

  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) btn.classList.add("correct");
    if (idx === i && idx !== q.a) btn.classList.add("wrong");
    if (idx === i) btn.classList.add("selected");
  });

  if (i === q.a) score++;

  exp.innerHTML = `<strong>${i === q.a ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  exp.style.display = "block";

  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.onclick = () => {
  current++;
  if (current < quizData.length) {
    showQuestion();
  } else {
    showResult();
  }
};

function getStars(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  if (percent >= 90) return "⭐️⭐️☆";
  if (percent >= 80) return "⭐️☆☆";
  return "☆☆☆";
}

function showResult() {
  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class="stars">${getStars(percent)}</div>
    <div class="result">Score: ${score}/${quizData.length} (${percent}%)</div>
    <div class="quiz-nav">
      <button class="quiz-btn" id="backBtn">⬅ Back</button>
      <button class="quiz-btn" onclick="location.reload()">🔁 Retry</button>
      <button class="quiz-btn primary" id="nextLessonBtn" ${passed ? "" : "disabled"}>➡ Next Lesson</button>
    </div>
  `;

  progressBar.style.width = "100%";
  progressText.textContent = "Completed";
  nextBtn.style.display = "none";

  window.parent.postMessage({
    type: "quizResult",
    score: percent,
    passed: passed
  }, "*");

  document.getElementById("backBtn").addEventListener("click", () => {
    window.parent.postMessage({ type: "quizBack" }, "*");
  });

  document.getElementById("nextLessonBtn").addEventListener("click", () => {
    if (passed) {
      window.parent.postMessage({ type: "quizNextLesson" }, "*");
    }
  });
}

showQuestion();
</script>

</body>
</html>
