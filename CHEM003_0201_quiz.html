<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 2 – Lesson 1 Quiz: Alcohols, Ethers, Thiols, Ketones & Aldehydes</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f3fbf8, #f6f9ff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
    position: relative;
  }

  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.1);
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 8px;
  }

  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }

  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    font-size: 1.05em;
    transition: all 0.2s ease;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 20px;
  }

  .stars {
    font-size: 2.5em;
    margin-top: 10px;
    margin-bottom: 5px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }
</style>
</head>

<body>
<div class="quiz-container">
  <h2>Alcohols, Ethers, Thiols, Ketones & Aldehydes – Quiz</h2>
  <div class="progress-text" id="progressText">Question 1 of 10</div>
  <div class="progress-wrapper"><div class="progress-bar" id="progressBar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
const quizData = [
  {
    q: "1. Which functional group defines an alcohol?",
    c: ["–SH", "–OH", "–COOH", "–CHO"],
    a: 1,
    e: "An alcohol contains a hydroxyl group (–OH) attached to a carbon atom."
  },
  {
    q: "2. What is the IUPAC name of CH₃CH₂OH?",
    c: ["Methanol", "Ethanol", "Propanol", "Butanol"],
    a: 1,
    e: "CH₃CH₂OH is ethanol, a two-carbon alcohol."
  },
  {
    q: "3. Which compound is classified as an ether?",
    c: ["CH₃CH₂OH", "CH₃OCH₂CH₃", "CH₃SH", "CH₃CHO"],
    a: 1,
    e: "CH₃OCH₂CH₃ has an oxygen linking two carbon chains — that’s the ether functional group."
  },
  {
    q: "4. What is the product of oxidizing a primary alcohol with PCC?",
    c: ["Ketone", "Carboxylic acid", "Aldehyde", "No reaction"],
    a: 2,
    e: "Mild oxidation (e.g., PCC) converts primary alcohols to aldehydes, not further to acids."
  },
  {
    q: "5. Which of the following best describes the Williamson ether synthesis?",
    c: [
      "A dehydration between two alcohols forming an ether",
      "Reaction of an alkoxide ion with an alkyl halide (SN2)",
      "Direct combination of alkyl halides with water",
      "Reaction of a thiol with halides"
    ],
    a: 1,
    e: "Williamson ether synthesis uses an alkoxide nucleophile reacting with an alkyl halide via SN2 substitution."
  },
  {
    q: "6. What happens when two thiol groups (R–SH) are oxidized?",
    c: ["They form an ether bond", "They form a disulfide bond", "They form an ester", "They are reduced to alcohols"],
    a: 1,
    e: "Two thiols oxidize to form a disulfide linkage (R–S–S–R), important in protein structure."
  },
  {
    q: "7. Which compound is an aldehyde?",
    c: ["CH₃CH₂OH", "CH₃COCH₃", "CH₃CHO", "CH₃SH"],
    a: 2,
    e: "CH₃CHO (ethanal) is an aldehyde because it has a terminal –CHO carbonyl group."
  },
  {
    q: "8. Why do alcohols generally have higher boiling points than ethers?",
    c: ["Because ethers are nonpolar", "Because alcohols form hydrogen bonds", "Because ethers contain sulfur", "Because alcohols are ionic"],
    a: 1,
    e: "Alcohols can both donate and accept hydrogen bonds, greatly increasing intermolecular forces and boiling point."
  },
  {
    q: "9. The oxidation of a secondary alcohol produces:",
    c: ["Aldehyde", "Ketone", "Carboxylic acid", "No reaction"],
    a: 1,
    e: "Secondary alcohols oxidize to ketones — they lack the hydrogen required for aldehyde formation."
  },
  {
    q: "10. In biological systems, disulfide bonds (–S–S–) are important because:",
    c: ["They store energy like ATP", "They stabilize protein structure", "They act as enzymes", "They make sugars soluble"],
    a: 1,
    e: "Disulfide bonds between cysteine residues help stabilize protein tertiary and quaternary structures."
  }
];

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;
  if (correct) score++;
  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";
  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn'>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn'>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' ${passed ? "" : "disabled"}>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";
  window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");

  document.getElementById("retryBtn").addEventListener("click", retryQuiz);
  document.getElementById("backBtn").addEventListener("click", () => window.parent.postMessage({ type: "quizBack" }, "*"));
  document.getElementById("nextLessonBtn").addEventListener("click", () => { if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*"); });
}

function retryQuiz() {
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
